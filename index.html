<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EDR 3D Viewer</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <aside id="panel">
    <header>
      <button id="hidePanel" class="icon panel-toggle" title="Hide the controls (more room for the 3D view)">«</button>
      <h1>EDR 3D Viewer</h1>
      <p class="sub">OGC API – EDR cube → WebGL isosurfaces</p>
    </header>

    <details open>
      <summary>Presets</summary>
      <div id="presetList" class="presets"></div>
    </details>

    <details open>
      <summary>Data</summary>
      <div class="collection-url">
        <label for="collectionUrl">EDR endpoint or collection URL</label>
        <textarea id="collectionUrl" rows="2" spellcheck="false" placeholder="https://…/edr  or  https://…/edr/collections/{id}"
          title="An endpoint lists its collections with levels; a collection URL opens that collection. Press Enter or Open."></textarea>
        <button id="openCollection" class="primary">Open</button>
        <label id="collectionListWrap" class="stack collection-list" hidden>
          <span>Collection <span id="collectionListCount" class="muted"></span></span>
          <select id="collectionList" title="Collections of this endpoint with at least two levels"></select>
        </label>
      </div>
      <div class="row">
        <label class="stack grow">Instance <select id="instance"></select></label>
        <label class="stack grow">Time <select id="datetime"></select></label>
      </div>
      <label class="stack">Parameter <select id="parameter"></select></label>
      <label class="stack" title="Grid of the returned data: resampled to lon/lat, or the model's own grid when the collection offers it (crs=native)">Grid
        <select id="gridCrs"></select>
      </label>
      <div class="grid4">
        <label class="stack">West <input id="bboxW" type="number" step="0.1"></label>
        <label class="stack">South <input id="bboxS" type="number" step="0.1"></label>
        <label class="stack">East <input id="bboxE" type="number" step="0.1"></label>
        <label class="stack">North <input id="bboxN" type="number" step="0.1"></label>
      </div>
      <div class="row">
        <button id="defaultDomain" class="grow" title="Set the bbox back to the default Netherlands area and load it">Netherlands</button>
        <button id="fullDomain" class="grow" title="Set the bbox to the model domain extent and load it">Full model domain</button>
      </div>
      <div class="row">
        <label class="stack grow" title="Average n×n server grid points; auto keeps each level below ~100k points">Horizontal step
          <select id="stride">
            <option value="auto" selected>auto</option>
            <option value="1">1 (full resolution)</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </label>
        <label class="stack grow" title="Load every n-th model level between level from and level to: fewer levels, faster loading">Vertical step
          <select id="levelStep">
            <option value="1" selected>1 (every level)</option>
            <option value="2">2</option>
            <option value="3">3</option>
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </label>
      </div>
      <label class="stack" title="Points in x and y that the server resamples the data to (EDR resolution-x / resolution-y), for servers that support it, e.g. when the native grid is too large for one request. Empty: the server's own grid.">Server resolution (x × y points)
        <input id="serverResolution" type="text" placeholder="the server's own grid, e.g. 300x300" spellcheck="false">
      </label>
      <div class="row">
        <label class="stack grow">Level from <input id="levelFrom" type="number" min="1" value="1"></label>
        <label class="stack grow">Level to <input id="levelTo" type="number" min="1" value="90"></label>
      </div>
      <label class="stack">Vertical coordinate
        <select id="vmode">
          <option value="level">Model level index (stretches boundary layer)</option>
          <option value="pressure">Pressure altitude (ISA, loads air_pressure_ml)</option>
        </select>
      </label>
      <div class="row">
        <label class="stack grow" title="1 = one request per level; ≥ number of levels = everything in one request">Levels/req.
          <input id="levelsPerRequest" type="number" min="1" max="200" value="5">
        </label>
        <label class="stack grow">Parallel
          <input id="concurrency" type="number" min="1" max="16" value="6">
        </label>
        <label class="stack grow" title="The server currently returns levels 2..n of a multi-level response multiplied by 10">×10 fix
          <select id="fixScale">
            <option value="auto">auto</option>
            <option value="on">on</option>
            <option value="off">off</option>
          </select>
        </label>
      </div>
      <div class="row">
        <button id="load" class="primary grow">Load</button>
        <button id="cancel" disabled>Cancel</button>
      </div>
      <progress id="progress" max="1" value="0"></progress>
      <div id="status" class="status"></div>
      <a id="requestUrl" class="request" target="_blank" rel="noopener"></a>

      <details class="subsection">
        <summary>Paste a cube URL</summary>
        <label class="stack">Takes collection, instance, time, bbox, levels and crs from an EDR cube URL
          <textarea id="url" rows="4" spellcheck="false"></textarea>
        </label>
        <button id="applyUrl">Apply URL &amp; load</button>
      </details>
    </details>

    <details open>
      <summary>Isosurface / volume</summary>
      <label class="stack">Render threshold as
        <select id="renderMode">
          <option value="iso">Isosurface</option>
          <option value="volume" selected>Volume</option>
          <option value="both">Isosurface + volume</option>
        </select>
      </label>
      <div id="isoList"></div>
      <div class="row">
        <button id="addIso">+ Add isosurface</button>
      </div>
      <label class="slider">Surface opacity <input id="isoOpacity" type="range" min="0.1" max="1" step="0.05" value="0.85"><output></output></label>
      <div id="volumeOpts" hidden>
        <label class="stack">Volume style
          <select id="volStyle">
            <option value="2">Soft band around each value</option>
            <option value="0">Fill above first value</option>
            <option value="1" selected>Fill below first value</option>
          </select>
        </label>
        <label class="stack">Volume colour
          <select id="volColor">
            <option value="fit" selected>Colour map, stretched to filled range</option>
            <option value="cmap">Colour map, colour-bar range</option>
            <option value="iso">Isosurface colours</option>
          </select>
        </label>
        <div id="volCbarWrap">
          <canvas id="volColorbar" width="300" height="10"></canvas>
          <div class="row cbar-labels"><span id="volCbarMin"></span><span id="volCbarUnit"></span><span id="volCbarMax"></span></div>
        </div>
        <label class="slider">Width <input id="volWidth" type="range" min="0.1" max="10" step="0.1" value="1.5"><output></output></label>
        <label class="slider">Density <input id="volDensity" type="range" min="-1.3" max="1.3" step="0.01" value="0"><output></output></label>
        <label class="slider">Quality <input id="volSteps" type="range" min="64" max="768" step="32" value="320"><output></output></label>
      </div>
    </details>

    <details open>
      <summary>Slices</summary>
      <div class="slice">
        <label class="check"><input id="sliceZOn" type="checkbox"> Horizontal</label>
        <input id="sliceZ" type="range" min="0" max="0" step="1"><output id="sliceZOut"></output>
      </div>
      <div class="slice">
        <label class="check"><input id="sliceXOn" type="checkbox"> Along lon</label>
        <input id="sliceX" type="range" min="0" max="0" step="1"><output id="sliceXOut"></output>
      </div>
      <div class="slice">
        <label class="check"><input id="sliceYOn" type="checkbox"> Along lat</label>
        <input id="sliceY" type="range" min="0" max="0" step="1"><output id="sliceYOut"></output>
      </div>
      <label class="slider">Opacity <input id="sliceOpacity" type="range" min="0.1" max="1" step="0.05" value="0.9"><output></output></label>
      <div class="row">
        <label class="check"><input id="contoursOn" type="checkbox" checked> Contour lines every</label>
        <input id="contourInterval" type="number" min="0.1" step="0.5" value="2" class="narrow">
      </div>
      <label class="check"><input id="isoLinesOn" type="checkbox" checked> Mark isosurface values on slices</label>
    </details>

    <details open>
      <summary>Appearance</summary>
      <label class="stack">Colour map <select id="colormap"></select></label>
      <canvas id="colorbar" width="300" height="14"></canvas>
      <div class="row cbar-labels"><span id="cbarMin"></span><span id="cbarUnit"></span><span id="cbarMax"></span></div>
      <div class="row">
        <label class="check"><input id="autoRange" type="checkbox" checked> Auto range</label>
        <input id="rangeMin" type="number" step="0.5" class="narrow" disabled>
        <input id="rangeMax" type="number" step="0.5" class="narrow" disabled>
      </div>
      <label class="stack">Base map (KNMI baselayers WMS)
        <select id="baseLayer">
          <option value="knmi_animated_gif_background_europe_elevation_1km_combined" selected>Europe elevation 1km combined</option>
        </select>
      </label>
      <label class="slider">Map brightness <input id="mapBrightness" type="range" min="0.2" max="1" step="0.05" value="0.75"><output></output></label>
      <label class="slider">Vertical scale <input id="vscale" type="range" min="-1" max="1.5" step="any" value="0.30103"><output></output></label>
      <div class="row wrap">
        <label class="check"><input id="bordersOn" type="checkbox"> Vector borders</label>
        <label class="check"><input id="boxOn" type="checkbox" checked> Box</label>
        <label class="check" title="Draw the grid cells in use: cell edges on the ground, columns and levels on two walls"><input id="gridOn" type="checkbox"> Grid cells</label>
        <label class="check"><input id="labelsOn" type="checkbox" checked> Labels</label>
      </div>
      <label class="check" title="A reference while flying: sky, horizon and stars, infinitely far away"><input id="skyOn" type="checkbox"> Sky with horizon and stars</label>
      <label class="check" title="The sun where it is at the shown time, seen from the centre of the data: its light, and daylight in the sky"><input id="sunOn" type="checkbox"> Sun at the shown time</label>
      <label class="check" title="The base map continued around the data (about 7× the area) with degree lines"><input id="earthOn" type="checkbox"> Earth surface around the data</label>
      <label class="check"><input id="hazeOn" type="checkbox" checked> Depth haze (fade distant data)</label>
      <label class="slider">Haze amount <input id="hazeAmount" type="range" min="0.05" max="1" step="0.05" value="0.4"><output></output></label>
      <button id="resetView">Reset view</button>
    </details>
  </aside>

  <main id="view">
    <canvas id="c"></canvas>
    <div id="viewControls" class="view-controls" aria-label="View controls">
      <button id="showPanel" class="icon show-panel" title="Show the controls" hidden>☰</button>
      <label class="vc-param">Parameter
        <select id="vcParam" title="Parameter shown; changing it loads the new parameter"></select>
      </label>
      <label class="vc-time">Time
        <span class="vc-inline">
          <button id="vcTimePrev" class="icon" title="Previous time">‹</button>
          <select id="vcTime" title="Time shown; changing it loads that time"></select>
          <button id="vcTimeNext" class="icon" title="Next time">›</button>
          <button id="vcPlay" class="icon play" title="Animate over time">▶</button>
          <select id="vcSpeed" class="speed" title="Time per frame (at least; loading a new time can take longer)">
            <option value="250">0.25 s</option>
            <option value="500" selected>0.5 s</option>
            <option value="1000">1 s</option>
            <option value="2000">2 s</option>
          </select>
          <select id="vcPrefetch" class="speed" title="Times loaded ahead while animating: more keeps the server busy while a time is shown">
            <option value="1">ahead 1</option>
            <option value="2" selected>ahead 2</option>
            <option value="3">ahead 3</option>
          </select>
          <span id="vcAnimInfo" class="vc-unit"></span>
        </span>
      </label>
      <div class="vc-column">
        <label id="vcThresholdWrap" class="vc-threshold" title="First isosurface value, also the volume's fill threshold">Threshold
          <span class="vc-inline">
            <input id="vcThreshold" type="range" step="0.1">
            <input id="vcThresholdNum" type="number" step="0.1">
            <span id="vcUnit" class="vc-unit"></span>
          </span>
        </label>
        <label id="vcDensityWrap" class="vc-density" title="Opacity of the volume">Density
          <span class="vc-inline">
            <input id="vcDensity" type="range" min="-1.3" max="1.3" step="0.01">
            <output id="vcDensityOut"></output>
          </span>
        </label>
      </div>
      <label class="vc-render">Show as
        <select id="vcRender" title="How the threshold is drawn">
          <option value="vol-0">Volume – fill above</option>
          <option value="vol-1">Volume – fill below</option>
          <option value="vol-2">Volume – band around</option>
          <option value="iso">Isosurface</option>
        </select>
      </label>
      <label class="vc-check" title="Wrap the scene around the Earth: the data at its real place and curvature on a globe">
        <span class="vc-inline"><input id="globeOn" type="checkbox"> Globe</span>
      </label>
      <label id="vcStreamWrap" class="vc-check" title="Particles moving with the wind, inside the volume" hidden>
        <span class="vc-inline"><input id="vcStream" type="checkbox" checked> Streamlines</span>
      </label>
      <label class="vc-vscale">Vertical scale
        <span class="vc-inline">
          <input id="vcVscale" type="range" min="-1" max="1.5" step="any">
          <output id="vcVscaleOut"></output>
        </span>
      </label>
    </div>
    <div id="hud"></div>
    <div id="flightInfo" class="flight-info" aria-live="off"></div>
    <div class="keys-hint">Fly: <kbd>W</kbd><kbd>S</kbd> faster/slower · <kbd>A</kbd><kbd>D</kbd> sideways ·
      <kbd>Q</kbd><kbd>E</kbd> down/up · <kbd>←</kbd><kbd>↑</kbd><kbd>↓</kbd><kbd>→</kbd> turn · <kbd>Shift</kbd> boost ·
      <kbd>Space</kbd> stop</div>
    <div id="tooltip" hidden></div>
    <div id="overlay" hidden>
      <div class="loader">
        <div class="spinner"></div>
        <div id="loadTitle" class="load-title">Loading…</div>
        <div class="bar"><div id="loadBar"></div></div>
        <div id="loadDetail" class="load-detail"></div>
        <button id="cancel2">Cancel</button>
      </div>
    </div>
  </main>

  <script type="module" src="./src/main.js"></script>
</body>
</html>
