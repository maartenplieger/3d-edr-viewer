<svg width="256" height="256" viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <!-- EDR 3D Viewer: the ADAGUC globe seen from space, with a data cube and a jet stream above the horizon -->
  <defs>
    <clipPath id="c">
      <circle cx="16" cy="16" r="14"/>
    </clipPath>
    <radialGradient id="space" cx="16" cy="9" r="16" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#1C3555"/>
      <stop offset="1" stop-color="#0A1424"/>
    </radialGradient>
    <linearGradient id="shine" x1="6" y1="4" x2="26" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.16"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <g clip-path="url(#c)">
    <!-- space -->
    <circle cx="16" cy="16" r="14" fill="url(#space)"/>
    <g fill="#FFFFFF">
      <circle cx="7.5" cy="9" r="0.45"/>
      <circle cx="11" cy="5" r="0.35" fill-opacity="0.8"/>
      <circle cx="23.5" cy="6.5" r="0.45"/>
      <circle cx="26" cy="12.5" r="0.35" fill-opacity="0.8"/>
      <circle cx="5.5" cy="14" r="0.3" fill-opacity="0.7"/>
      <circle cx="19.5" cy="4" r="0.3" fill-opacity="0.7"/>
    </g>
    <!-- the globe seen from above: atmosphere, sky, land (colours of the ADAGUC globe) -->
    <circle cx="16" cy="43" r="22.8" fill="none" stroke="#8FD8F5" stroke-opacity="0.55" stroke-width="0.9"/>
    <circle cx="16" cy="43" r="22" fill="#2BA3D0"/>
    <circle cx="16" cy="45.5" r="21" fill="#F1C92D"/>
    <circle cx="15" cy="48" r="21" fill="#6DBB25"/>
    <!-- data cube (isometric) -->
    <g stroke="#FFFFFF" stroke-width="0.8" stroke-linejoin="round">
      <path d="M11.5 10 L16 12.5 L16 18 L11.5 15.5 Z" fill="#2BA3D0" fill-opacity="0.35"/>
      <path d="M16 12.5 L20.5 10 L20.5 15.5 L16 18 Z" fill="#2BA3D0" fill-opacity="0.2"/>
      <path d="M16 7.5 L20.5 10 L16 12.5 L11.5 10 Z" fill="#FFFFFF" fill-opacity="0.22"/>
    </g>
    <!-- jet stream through the cube -->
    <path d="M5.5 16.5 C 10 10.5, 17.5 17.5, 26.5 9.5" fill="none" stroke="#FF8C1A" stroke-width="1.6" stroke-linecap="round"/>
    <path d="M7 19 C 12 14.5, 19 19.5, 26 14" fill="none" stroke="#FFB45C" stroke-width="0.7" stroke-linecap="round" stroke-opacity="0.85"/>
    <!-- soft directional shine, flat -->
    <circle cx="16" cy="16" r="14" fill="url(#shine)"/>
  </g>

  <circle cx="16" cy="16" r="14.5" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="1.4"/>
</svg>
